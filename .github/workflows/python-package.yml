# Workflow is based on the DESI desitemplate GitHub actions layout.
name: CI

on:
    push:
        branches:
            - '*'
        tags:
            - '*'
    pull_request:

jobs:
    tests:
        name: Unit tests
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: true
            matrix:
                include:
                    - os: ubuntu-latest
                      coverage: test
                      python-version: '3.12'
                    - os: ubuntu-latest
                      coverage: coverage
                      python-version: '3.11'
                    - os: ubuntu-latest
                      coverage: test
                      python-version: '3.10'

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                python-version: ${{ matrix.python-version }}
            - name: Install Python dependencies
              run: |
                python -m pip install --upgrade pip setuptools wheel
                python -m pip install --upgrade numpy scipy astropy
            - name: Install the package itself
              run: python -m pip install --editable .[${{ matrix.coverage }}]
            - name: Run the test
              run: bash -c 'if [[ "${{ matrix.coverage }}" == "coverage" ]]; then pytest --cov; else pytest; fi'
            - name: Coveralls
              if: ${{ matrix.coverage == 'coverage' }}
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
              run: coveralls

    docs:
        name: Doc test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                python-version: '3.12'
            - name: Install Python dependencies
              run: |
                python -m pip install --upgrade pip setuptools wheel
                python -m pip install --editable .[doc]
            - name: Test the documentation
              run: sphinx-build -W --keep-going -b html doc doc/_build/html

    style:
        name: Style check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                python-version: '3.12'
            - name: Install Python dependencies
              run: python -m pip install --upgrade pip setuptools wheel pycodestyle flake8
            - name: Test the style
              run: pycodestyle --count --statistics py/just_mospec
            - name: Test the style and code use more rigorously with flake8
              continue-on-error: true
              run: flake8 --statistics --count py/just_mospec
